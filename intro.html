<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macula Egypt</title>
<link rel="icon" href="assets/logo.png">
<style>
:root{--bg:#0b0813;--panel:#1a1329;--magenta:#ec1587;--violet:#7b2ff0;--white:#f6f3fb;--muted:#b6acc9;--speed:38s}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 40%,#1e1236 0%,var(--bg) 65%);color:var(--white);font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;overflow:hidden;padding:24px 0}
.head{text-align:center;padding:0 20px}
.head img{width:84px;height:84px;object-fit:contain}
.head h1{font-size:clamp(20px,3vw,30px);letter-spacing:.3em;margin-top:10px}
.head p{color:var(--muted);font-size:14px;margin-top:6px;letter-spacing:.08em}
.rows{width:100%;display:flex;flex-direction:column;gap:20px;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.row{overflow:hidden;width:100%}
.track{display:flex;gap:20px;width:max-content;animation:var(--speed) linear infinite}
.row.right .track{animation-name:toRight}
.row.left .track{animation-name:toLeft}
.row:hover .track{animation-play-state:paused}
@keyframes toRight{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes toLeft{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tile{flex:none;width:250px;height:140px;border-radius:18px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tile.dark{background:var(--panel);border:1px solid rgba(255,255,255,.08)}
.tile img{max-width:100%;max-height:100%;object-fit:contain}
.enter{display:flex;flex-direction:column;align-items:center;gap:12px}
.btn{background:linear-gradient(90deg,var(--magenta),var(--violet));color:#fff;text-decoration:none;padding:14px 38px;border-radius:999px;font-weight:700;letter-spacing:.12em;font-size:14px}
.btn:hover{filter:brightness(1.12)}
.bar{width:160px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--magenta);animation:fill 7s linear forwards}
@keyframes fill{to{width:100%}}
.skip{color:var(--muted);font-size:12px;text-decoration:none}
@media(max-width:600px){.tile{width:180px;height:100px;padding:14px}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}
</style>
</head>
<body>
<div class="head">
  <img src="assets/logo.png" alt="Macula">
  <h1>MACULA EGYPT</h1>
  <p>Trusted by brands &amp; partners</p>
</div>

<div class="rows">
  <div class="row right"><div class="track" data-logos="elshams,mosaique,gabi,together"></div></div>
  <div class="row left"><div class="track" data-logos="ladies-zone,gabi-cuisine,oic,macula"></div></div>
</div>

<div class="enter">
  <a class="btn" href="index.html" id="go">ENTER SITE</a>
  <div class="bar"><i></i></div>
</div>
<audio id="introSound" src="assets/intro/intro-sound.mp3" preload="auto"></audio>

<script>
var dark={together:1,oic:1};
document.querySelectorAll('.track').forEach(function(t){
  var names=t.dataset.logos.split(','),html='';
  for(var i=0;i<6;i++)names.forEach(function(n){
    html+='<div class="tile'+(dark[n]?' dark':'')+'"><img src="assets/intro/'+n+'.png" alt="'+n+'"></div>';
  });
  t.innerHTML=html; // 6 copies = two identical halves, seamless loop
});
try{sessionStorage.setItem('macula-intro','1')}catch(e){}
// intro sound: try autoplay; if the browser blocks it, play on the first tap/click/key
(function(){
  var a=document.getElementById('introSound'),done=false;
  function unlock(){
    if(done)return;
    var p=a.play();
    if(p&&p.then)p.then(function(){done=true;cleanup()}).catch(function(){});
    else{done=true;cleanup()}
  }
  var evs=['pointerdown','pointerup','touchstart','touchend','keydown','click'];
  function cleanup(){evs.forEach(function(e){document.removeEventListener(e,unlock)})}
  var p=a.play();
  if(p&&p.then){
    p.then(function(){done=true}).catch(function(){
      evs.forEach(function(e){document.addEventListener(e,unlock)});
    });
  }
})();
setTimeout(function(){location.href='index.html'},7000);
</script>
</body>
</html>
